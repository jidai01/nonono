name: Auto Version on Push to Main

on:
  push:
    branches:
      - main

jobs:
  version:
    name: Update Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get last tag
        id: lasttag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Count commits since last tag
        id: commits
        run: |
          COMMITS=$(git rev-list ${{ steps.lasttag.outputs.tag }}..HEAD --count)
          echo "count=$COMMITS" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: version
        run: |
          LAST_TAG="${{ steps.lasttag.outputs.tag }}"
          COMMITS="${{ steps.commits.outputs.count }}"
          
          # Extract version numbers
          if [[ $LAST_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          else
            MAJOR=0
            MINOR=0
            PATCH=0
          fi
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "number=${MAJOR}.${MINOR}.${NEW_PATCH}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.number }} --no-git-tag-version

      - name: Commit and tag
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.number }}" || true
          git tag ${{ steps.version.outputs.new }}
          git push origin main --tags

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new }}
          name: "nonono ${{ steps.version.outputs.new }}"
          body: |
            ## Version ${{ steps.version.outputs.number }}
            
            ### Changes
            
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ### Installation
            
            1. Go to [Releases](${{ github.server_url }}/${{ github.repository }}/releases)
            2. Download `nonono.apk`
            3. Enable "Install from unknown sources" on your Android device
            4. Open the APK file to install
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
