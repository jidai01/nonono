<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA0E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B8AFF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A90D9" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="70" fill="url(#grad2)"/>
  
  <!-- Heartbeat/pulse line representing recovery journey -->
  <path d="M 40 100 L 65 100 L 75 70 L 85 130 L 95 85 L 105 115 L 115 90 L 125 100 L 160 100" 
        stroke="white" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Small heart at the end of the line -->
  <path d="M 135 95 C 135 85, 150 85, 150 95 C 150 85, 165 85, 165 95 C 165 110, 150 120, 150 120 C 150 120, 135 110, 135 95" 
        fill="white" 
        opacity="0.9"/>
  
  <!-- Letter N stylized -->
  <text x="100" y="145" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="36" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle" 
        opacity="0.95">NONONO</text>
</svg>
